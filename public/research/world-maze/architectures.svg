<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1258" viewBox="0 0 680 1258" role="img" aria-labelledby="title desc">
<title id="title">Architecture comparison and exit-task results</title>
<desc id="desc">Sequence policy with training-only past-map and pose losses: 46.2% success. Sequence policy reading predicted spatial features via attention: 50.8%. Persistent spatial memory with learned writes and pooled reads: 43.3%. Clearing that memory each step while retaining odometry: 6.2%. All use frames and actions only at inference. Mean results over three trained seeds on 200 fresh confirmation mazes.</desc>
